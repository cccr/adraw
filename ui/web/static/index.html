<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adraw</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <button id="back" class="back" hidden>&#8592;</button>
  <span class="brand">adraw</span>
  <span id="crumb" class="crumb" hidden>
    <span class="sep">/</span>
    <span id="crumb-category" class="crumb-category"></span>
    <span class="sep">/</span>
    <span id="crumb-patch" class="crumb-patch"></span>
  </span>
</header>

<!-- Landing page: one section per category, one tile per patch. -->
<main id="gallery" class="gallery" hidden>
  <p class="lede">
    Pick a pattern to start from. Every tile is generated by the patch it names,
    so what you see is what it draws.
  </p>
  <div id="categories"></div>
</main>

<!-- Editor: controls on the left, live canvas on the right. -->
<div id="editor" class="editor" hidden>
  <aside id="panel">
    <p id="patch-desc" class="desc"></p>

    <div class="field">
      <span class="field-label">Page</span>
      <select id="page-preset"></select>
      <span class="page-row">
        <input id="page-w" type="number" min="10" max="2000" step="1" aria-label="Page width, mm">
        <span class="page-x">&times;</span>
        <input id="page-h" type="number" min="10" max="2000" step="1" aria-label="Page height, mm">
        <span class="page-unit">mm</span>
        <button id="page-swap" class="icon" title="Rotate">&#8646;</button>
      </span>
    </div>

    <label class="field">
      <span class="field-label">Seed</span>
      <span class="seed-row">
        <input id="seed" type="number" value="1" step="1">
        <button id="reseed" title="Random seed">&#8635;</button>
      </span>
    </label>

    <div id="params"></div>

    <div class="actions">
      <button id="reset" class="secondary">Reset</button>
      <button id="print" class="secondary">Print</button>
    </div>
    <div class="actions actions-tight">
      <button id="svg">Save SVG</button>
      <button id="gcode">Save G-code</button>
    </div>

    <p id="status" class="status"></p>
  </aside>

  <main id="stage">
    <canvas id="canvas"></canvas>
  </main>
</div>

<!-- Filled only while printing. See the print section in app.js for why it is
     not kept populated the rest of the time. -->
<div id="print-area" aria-hidden="true"></div>
<style id="print-page"></style>

<script src="app.js"></script>
</body>
</html>
